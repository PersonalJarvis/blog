# Build the blog and publish it to GitHub Pages at blog.personaljarvis.ai.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A lockfile resolved on Windows can lack Linux-only optional packages;
      # fall back to a plain install instead of silently not publishing.
      - name: Install
        run: |
          if ! npm ci; then
            echo "::warning::npm ci refused the lockfile — falling back to npm install."
            npm install --no-audit --no-fund
          fi
      - run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
